[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep the preview out of search engines until launch.
# At launch: set PUBLIC_SITE_LIVE=true in Netlify and delete this block.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Soft launch: on the real domain, only the join form and its support pages are reachable.
# Everything else stays on the netlify.app preview. Delete these rules at full launch.

[[redirects]]
  from = "https://www.mindshiftcollective.net/join"
  to = "/join"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/join/*"
  to = "/join/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/thank-you"
  to = "/thank-you"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/thank-you/*"
  to = "/thank-you/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/privacy"
