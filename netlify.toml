[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep the preview out of search engines until launch.
# At launch: set PUBLIC_SITE_LIVE=true in Netlify and delete this block.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
