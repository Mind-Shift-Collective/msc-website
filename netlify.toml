[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Search engines: the real domain serves robots.txt and sitemap.xml (join + privacy only).
# The netlify.app preview serves robots-preview.txt, which blocks everything.
# Pages are noindex unless they opt in with index={true} in Base.astro.
[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "https://mind-shift-collective.netlify.app/robots.txt"
  to = "/robots-preview.txt"
  status = 200
  force = true

# Join-only: the home page shows the join form on every address (including netlify.app).
# Delete this rule to bring back the full home page.
[[redirects]]
  from = "/"
  to = "/join/"
  status = 200
  force = true

# Soft launch: on the real domain, only the join form and its support pages are reachable.
# Everything else stays on the netlify.app preview. Delete these rules at full launch.

[[redirects]]
  from = "https://www.mindshiftcollective.net/join"
  to = "/join"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/join/*"
  to = "/join/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.mindshiftcollective.net/thank-you"
